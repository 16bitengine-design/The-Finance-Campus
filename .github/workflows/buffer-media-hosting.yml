name: Buffer media hosting

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful production workflow run containing the reviewed package artifact
        required: true
        type: string
      artifact_name:
        description: Name of the production package artifact
        required: true
        default: finance-campus-production-package
        type: string
      approval:
        description: Confirm that this package has passed human visual review and is approved for public hosting
        required: true
        type: choice
        options:
          - not_approved
          - approve_public_hosting

permissions:
  contents: write
  actions: read

concurrency:
  group: finance-campus-media-hosting
  cancel-in-progress: false

jobs:
  host-approved-media:
    if: ${{ inputs.approval == 'approve_public_hosting' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download production package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: package
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Validate approval and locate media
        id: validate
        env:
          PACKAGE_DIR: package
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PACKAGE_DIR"])
          manifests = list(root.rglob("production-manifest.json"))
          if len(manifests) != 1:
              raise SystemExit(f"Expected exactly one production-manifest.json; found {len(manifests)}")
          manifest_path = manifests[0]
          package_root = manifest_path.parent
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          if manifest.get("status") != "quality_approved":
              raise SystemExit("Package is not quality_approved")
          if manifest.get("technical_quality_approved") is not True:
              raise SystemExit("Technical quality approval is missing")
          if manifest.get("human_visual_review_passed") is not True:
              raise SystemExit("Human visual review has not passed")
          if manifest.get("publication_approved") is not True:
              raise SystemExit("Publication approval is missing")
          stages = manifest.get("stages") or {}
          for stage in ("script_validated", "kokoro_narration_generated", "captions_validated",
                        "video_rendered", "media_streams_verified", "final_video_qc_passed"):
              if stages.get(stage) is not True:
                  raise SystemExit(f"Required stage did not pass: {stage}")

          artifacts = manifest.get("artifacts") or {}
          def locate(key, fallback_names):
              raw = artifacts.get(key)
              candidates = []
              if isinstance(raw, str):
                  candidates.extend([package_root / Path(raw).name, root / Path(raw).name])
              candidates.extend(package_root / name for name in fallback_names)
              for candidate in candidates:
                  if candidate.is_file() and candidate.stat().st_size > 1024:
                      return candidate.resolve()
              raise SystemExit(f"Required media artifact is missing: {key}")

          video = locate("video", ["finance-campus-video.mp4", "video.mp4"])
          thumbnail = locate("thumbnail", ["thumbnail-youtube.jpg", "thumbnail.jpg"])
          video_format = manifest.get("video_format")
          if video_format not in {"short", "long"}:
              raise SystemExit("Unsupported or missing video_format")
          video_id = str(manifest.get("video_id") or "").strip()
          if not video_id:
              raise SystemExit("A stable manifest.video_id is required before public hosting")
          title = str(manifest.get("title") or "").strip()
          if not title:
              raise SystemExit("Manifest title is required")

          # Stable, URL-safe tag with a content identity supplied by production.
          safe_id = "".join(ch.lower() if ch.isalnum() or ch in "-_" else "-" for ch in video_id)
          safe_id = "-".join(part for part in safe_id.split("-") if part)[:60]
          if not safe_id:
              raise SystemExit("video_id cannot produce a safe release tag")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag=finance-campus-media-{safe_id}\\n")
              output.write(f"video={video}\\n")
              output.write(f"thumbnail={thumbnail}\\n")
              output.write(f"title={title.replace(chr(10), ' ')[:180]}\\n")
              output.write(f"video_id={video_id}\\n")
          PY

      - name: Create public GitHub Release and host approved media
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
          VIDEO_PATH: ${{ steps.validate.outputs.video }}
          THUMBNAIL_PATH: ${{ steps.validate.outputs.thumbnail }}
          VIDEO_TITLE: ${{ steps.validate.outputs.title }}
          VIDEO_ID: ${{ steps.validate.outputs.video_id }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite media."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$VIDEO_PATH#finance-campus-video.mp4" "$THUMBNAIL_PATH#thumbnail-youtube.jpg" \
            --repo "$GH_REPO" \
            --title "The Finance Campus media: $VIDEO_TITLE" \
            --notes "Approved media package for video ID: $VIDEO_ID. Public assets are provided for Buffer scheduling. YouTube thumbnail is supplied separately for manual upload in YouTube Studio."

      - name: Verify public release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets,isDraft,isPrerelease > release.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("release.json").read_text(encoding="utf-8"))
          if data.get("isDraft") or data.get("isPrerelease"):
              raise SystemExit("Media release is not a public stable release")
          assets = {item.get("name"): item for item in data.get("assets", [])}
          for name in ("finance-campus-video.mp4", "thumbnail-youtube.jpg"):
              asset = assets.get(name)
              if not asset or not asset.get("url") or not asset.get("size"):
                  raise SystemExit(f"Release asset verification failed: {name}")
          print("Release assets exist and are attached to a non-draft, non-prerelease release.")
          PY

      - name: Upload hosted package for Buffer scheduling dry-run
        uses: actions/upload-artifact@v4
        with:
          name: finance-campus-hosted-package
          path: |
            package/**/production-manifest.json
            package/**/post-metadata.json
            package/**/*.mp4
            package/**/*thumbnail*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Record hosted media URL
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Public video URL: https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/finance-campus-video.mp4"
          echo "Public thumbnail URL: https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/thumbnail-youtube.jpg"
          echo "The URL must still pass the Buffer public-fetch probe before scheduling."
