name: Buffer publication monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-campus-buffer-publication-monitor
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ vars.BUFFER_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Finance Campus publisher
        run: python -m pip install -e .

      - name: Reconcile Buffer posts and verify public destination URLs
        run: python -m finance_campus.buffer_publisher --monitor

      - name: Persist publication states
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: reconcile Buffer publication states"
          file_pattern: production/buffer-publishing-ledger.json
