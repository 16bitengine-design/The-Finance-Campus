name: Buffer publication monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-campus-buffer-publication-monitor
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ vars.BUFFER_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Finance Campus publisher
        run: python -m pip install -e .

      - name: Reconcile Buffer posts and verify public destination URLs
        run: python -m finance_campus.buffer_publisher --monitor

      - name: Show individual thumbnail download links for verified publications
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          ledger_path = Path("production/buffer-publishing-ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          rows = []
          for key, record in ledger.get("posts", {}).items():
              if record.get("status") != "publicly_accessible_verified":
                  continue
              if record.get("thumbnail_download_link_shown_at"):
                  continue
              url = record.get("thumbnail_url")
              if not isinstance(url, str):
                  continue
              parsed = urlparse(url)
              if (parsed.scheme != "https" or parsed.hostname != "github.com"
                      or "/releases/download/" not in parsed.path
                      or not parsed.path.lower().endswith((".jpg", ".jpeg", ".png"))):
                  raise SystemExit(f"Refusing untrusted thumbnail URL for {key}: {url}")
              request = urllib.request.Request(
                  url, headers={"User-Agent": "The-Finance-Campus-thumbnail-link-check/1.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  content_type = response.headers.get("Content-Type", "").split(";", 1)[0].lower()
                  if content_type not in {"image/jpeg", "image/png"}:
                      raise SystemExit(f"Thumbnail is not a JPEG/PNG image for {key}")
                  if int(response.headers.get("Content-Length") or "0") == 0:
                      raise SystemExit(f"Thumbnail is empty for {key}")
              title = str(record.get("title") or record.get("video_id") or key)
              platform = str(record.get("platform") or "platform")
              rows.append((title, platform, url))
              record["thumbnail_download_link_shown_at"] = datetime.now(timezone.utc).isoformat()

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if rows:
              with summary.open("a", encoding="utf-8") as out:
                  out.write("## Your published thumbnails\n\n")
                  out.write("Tap an individual image link to download that thumbnail to this device.\n\n")
                  for title, platform, url in rows:
                      safe_title = title.replace("|", "\\|").replace("\n", " ")
                      out.write(f"- **{safe_title}** ({platform}) — [Download thumbnail]({url})\n")
          else:
              print("No newly verified thumbnails need a download link.")

          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Added {len(rows)} individual thumbnail download link(s) to the Actions run summary.")
          PY

      - name: Persist publication and thumbnail download records
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: reconcile publication and thumbnail links"
          file_pattern: production/buffer-publishing-ledger.json
