name: Buffer publication monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-campus-buffer-publication-monitor
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ vars.BUFFER_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Finance Campus publisher
        run: python -m pip install -e .

      - name: Reconcile Buffer posts and verify public destination URLs
        run: python -m finance_campus.buffer_publisher --monitor

      - name: Prepare downloads for newly verified published thumbnails
        id: thumbnails
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          ledger_path = Path("production/buffer-publishing-ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          output = Path("published-thumbnails")
          output.mkdir(exist_ok=True)
          prepared = 0

          for key, record in ledger.get("posts", {}).items():
              if record.get("status") != "publicly_accessible_verified":
                  continue
              if record.get("thumbnail_artifact_created_at"):
                  continue
              url = record.get("thumbnail_url")
              if not isinstance(url, str):
                  print(f"Skipping {key}: no hosted thumbnail URL was recorded.")
                  continue
              parsed = urlparse(url)
              if (parsed.scheme != "https" or parsed.hostname != "github.com"
                      or "/releases/download/" not in parsed.path
                      or not parsed.path.lower().endswith((".jpg", ".jpeg", ".png"))):
                  raise SystemExit(f"Refusing untrusted thumbnail URL for {key}: {url}")

              request = urllib.request.Request(
                  url, headers={"User-Agent": "The-Finance-Campus-thumbnail-archive/1.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  content_type = response.headers.get("Content-Type", "").split(";", 1)[0].lower()
                  data = response.read()
              if content_type not in {"image/jpeg", "image/png"} or len(data) < 1024:
                  raise SystemExit(f"Thumbnail failed type/size validation for {key}")
              safe = re.sub(r"[^A-Za-z0-9._-]+", "-", str(record.get("video_id") or key)).strip("-")
              platform = re.sub(r"[^A-Za-z0-9_-]+", "-", str(record.get("platform") or "platform"))
              suffix = ".png" if content_type == "image/png" else ".jpg"
              (output / f"{safe}-{platform}{suffix}").write_bytes(data)
              record["thumbnail_artifact_created_at"] = datetime.now(timezone.utc).isoformat()
              prepared += 1

          ledger_path.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(f"Prepared {prepared} newly verified thumbnail(s).")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"count={prepared}\\n")
          PY

      - name: Make published thumbnails downloadable on phone and laptop
        if: steps.thumbnails.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: finance-campus-published-thumbnails-${{ github.run_number }}
          path: published-thumbnails/*
          if-no-files-found: error
          retention-days: 90

      - name: Persist publication and thumbnail download records
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: reconcile publication and thumbnail downloads"
          file_pattern: production/buffer-publishing-ledger.json
