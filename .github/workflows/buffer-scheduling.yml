name: Buffer scheduling

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID that contains the production package artifact
        required: true
        type: string
      artifact_name:
        description: Name of the uploaded production package artifact
        required: true
        default: finance-campus-production-package
        type: string
      mode:
        description: Dry-run validation or schedule approved posts in Buffer
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - schedule
  workflow_call:
    inputs:
      source_run_id:
        description: Caller workflow run ID containing the production package artifact
        required: false
        type: string
      artifact_name:
        description: Name of the uploaded production package artifact
        required: false
        default: finance-campus-production-package
        type: string
      mode:
        description: Dry-run validation or schedule approved posts in Buffer
        required: false
        default: dry_run
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: finance-campus-buffer-publishing
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_PUBLISH_ENABLED: ${{ secrets.BUFFER_PUBLISH_ENABLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download approved production package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'finance-campus-production-package' }}
          path: package
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Finance Campus publisher
        run: python -m pip install -e .

      - name: Validate package and Buffer channels (dry run)
        if: ${{ inputs.mode != 'schedule' }}
        run: python -m finance_campus.buffer_publisher package

      - name: Schedule approved posts in Buffer
        if: ${{ inputs.mode == 'schedule' }}
        run: python -m finance_campus.buffer_publisher package --live

      - name: Persist duplicate-prevention ledger
        if: ${{ inputs.mode == 'schedule' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Record Buffer scheduled posts"
          file_pattern: production/buffer-publishing-ledger.json
