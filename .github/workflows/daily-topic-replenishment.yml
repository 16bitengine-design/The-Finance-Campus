name: Daily researched topic replenishment

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Choose whether to refresh the topic library or generate script candidates
        required: true
        default: refresh_topics
        type: choice
        options:
          - refresh_topics
          - generate_scripts
      duration:
        description: Script candidate format when action is generate_scripts
        required: false
        default: short
        type: choice
        options: [short, long]
      target:
        description: "Number of new topics to attempt each day"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: finance-campus-topic-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'refresh_topics' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Research and replenish canonical topic library
        id: refresh
        env:
          TOPIC_TARGET: ${{ github.event.inputs.target || '3' }}
        run: |
          mkdir -p production/reports
          set +e
          python -m finance_campus.cli refresh-topics production/topic-library.json --target "$TOPIC_TARGET" > production/reports/topic-refresh-report.json 2>&1
          status=$?
          set -e
          cat production/reports/topic-refresh-report.json
          if [ "$status" -eq 1 ]; then
            echo "::error::Topic refresh failed. The existing library was not approved for replacement."
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "::warning::The daily target was not fully met. Only source-checked, unique topics will be retained."
          fi
      - name: Validate canonical library and report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          library = json.loads(Path("production/topic-library.json").read_text(encoding="utf-8"))
          report = json.loads(Path("production/reports/topic-refresh-report.json").read_text(encoding="utf-8"))
          if not isinstance(library, list):
              raise SystemExit("Topic library must be a JSON array")
          ids = [item.get("id") for item in library]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate topic IDs detected")
          titles = [str(item.get("title", "")).casefold().strip() for item in library]
          if len(titles) != len(set(titles)):
              raise SystemExit("Duplicate topic titles detected")
          if report.get("library_count") != len(library):
              raise SystemExit("Refresh report count does not match canonical library")
          print(f"Validated {len(library)} unique topics; added {report.get('added_count', 0)} this run.")
          PY
      - name: Commit topic library and research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/topic-library.json production/reports/topic-refresh-report.json
          if git diff --cached --quiet; then
            echo "No new topics or report changes to commit."
          else
            git commit -m "chore: replenish researched finance topic library"
            git push
          fi
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-campus-topic-refresh-report
          path: production/reports/topic-refresh-report.json
          if-no-files-found: ignore

  generate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'generate_scripts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest topic library
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Generate uncreated script candidates on manual request only
        env:
          SCRIPT_DURATION: ${{ inputs.duration || 'short' }}
        run: |
          mkdir -p production/script-candidates production/reports
          python -m finance_campus.cli generate-pending-scripts production/topic-library.json production/script-candidates --duration "$SCRIPT_DURATION" | tee production/reports/script-generation-report.json
      - name: Commit new script candidates and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/script-candidates production/reports/script-generation-report.json
          if git diff --cached --quiet; then
            echo "No new script candidates."
          else
            git commit -m "chore: generate researched script candidates"
            git push
          fi
      - name: Upload script generation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-campus-script-generation-report
          path: production/reports/script-generation-report.json
          if-no-files-found: ignore
