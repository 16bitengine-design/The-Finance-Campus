name: Project quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check formatting and lint
        run: ruff check src tests

      - name: Render articulated character rig preview
        run: |
          python -m finance_campus.cli validate-character-rig examples/character-rig-parent.example.json
          python -m finance_campus.cli render-character examples/character-rig-parent.example.json /tmp/finance-campus-character-rig --fps 6
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          frames = sorted(Path("/tmp/finance-campus-character-rig").glob("character_*.png"))
          if len(frames) < 2:
              raise SystemExit("Character rig did not produce an animation sequence")
          picks = [frames[0], frames[len(frames)//2], frames[-1]]
          sheet = Image.new("RGB", (900, 460), (238, 242, 247))
          for i, path in enumerate(picks):
              image = Image.open(path).convert("RGBA")
              image.thumbnail((280, 410))
              tile = Image.new("RGBA", (280, 410), (255, 255, 255, 255))
              tile.alpha_composite(image, ((280-image.width)//2, (410-image.height)//2))
              sheet.paste(tile.convert("RGB"), (i*300+10, 10))
              ImageDraw.Draw(sheet).text((i*300+15, 430), path.stem, fill=(16, 43, 85))
          sheet.save("/tmp/finance-campus-character-rig-contact-sheet.jpg", quality=92)
          print(f"Rendered {len(frames)} articulated character frames")
          PY
      - name: Upload articulated character rig preview
        uses: actions/upload-artifact@v4
        with:
          name: finance-campus-character-rig-preview
          path: |
            /tmp/finance-campus-character-rig-contact-sheet.jpg
            /tmp/finance-campus-character-rig/character_*.png
          if-no-files-found: error

      - name: Render illustrated portrait sample and review frames
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=24000:duration=1" -af volume=12dB -c:a pcm_s16le /tmp/finance-campus-qc-tone.wav
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from finance_campus.video_renderer import render_video
          from finance_campus.final_video_qc import validate_final_video
          from finance_campus.storyboard_builder import build_storyboard
          from finance_campus.config import load_yaml
          import json
          script = json.loads(Path("examples/script-package.example.json").read_text(encoding="utf-8"))
          storyboard = build_storyboard(
              script, video_format="short",
              disclaimer_config=load_yaml("config/disclaimer.yaml"),
          )
          Path("/tmp/finance-campus-built-storyboard.json").write_text(
              json.dumps(storyboard, indent=2), encoding="utf-8"
          )
          output = Path("/tmp/finance-campus-sample.mp4")
          render_video(
              storyboard, output, video_format="short", fps=30, draw_fps=24,
              audio_path="/tmp/finance-campus-qc-tone.wav", keep_frames=True,
          )
          # This is a renderer smoke-test, not a publishable production video.
          # The production pipeline retains the mandatory 150-second minimum.
          qc = validate_final_video(
              output, video_format="short", expected_fps=30, minimum_duration_seconds=0,
          )
          print("Renderer smoke-test MP4 QC:", json.dumps(qc, indent=2))
          frames = sorted(Path("/tmp").glob(".finance-campus-sample_frames/frame_*.png"))
          if not frames:
              raise SystemExit("No rendered preview frames were produced")
          picks = [frames[min(len(frames)-1, int((len(frames)-1)*p))] for p in (0.08, 0.24, 0.40, 0.56, 0.72, 0.90)]
          tiles = []
          for frame in picks:
              image = Image.open(frame).convert("RGB")
              image.thumbnail((270, 480))
              tile = Image.new("RGB", (290, 520), "white")
              tile.paste(image, ((290-image.width)//2, 8))
              ImageDraw.Draw(tile).text((10, 495), frame.stem, fill=(16,43,85))
              tiles.append(tile)
          sheet = Image.new("RGB", (290*3, 520*2), (238,242,247))
          for index, tile in enumerate(tiles):
              sheet.paste(tile, ((index%3)*290, (index//3)*520))
          sheet.save("/tmp/finance-campus-contact-sheet.jpg", quality=92)
          PY
      - name: Upload rendered sample and visual review frames
        uses: actions/upload-artifact@v4
        with:
          name: finance-campus-illustrated-sample
          path: |
            /tmp/finance-campus-sample.mp4
            /tmp/finance-campus-contact-sheet.jpg
            /tmp/finance-campus-built-storyboard.json
          if-no-files-found: error

  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer/remotion
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Remotion renderer dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check animation compositions
        run: npm run typecheck
      - name: Render 150-second monochrome vector sample
        run: npm run render:sample
      - name: Upload monochrome vector sample
        uses: actions/upload-artifact@v4
        with:
          name: finance-campus-monochrome-vector-sample
          path: renderer/remotion/out/finance-campus-monochrome-sample.mp4
          if-no-files-found: error
