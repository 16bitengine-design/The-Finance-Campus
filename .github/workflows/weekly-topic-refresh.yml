name: Weekly researched topic refresh

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Number of new topics to attempt"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: finance-campus-topic-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Research and add unused topics
        id: refresh
        env:
          TOPIC_TARGET: ${{ github.event.inputs.target || '20' }}
        run: |
          mkdir -p data
          python -m finance_campus.cli refresh-topics data/topics.json --target "$TOPIC_TARGET" | tee topic-refresh-report.json
      - name: Commit topic library and research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topics.json topic-refresh-report.json
          if git diff --cached --quiet; then
            echo "No new topics to commit."
          else
            git commit -m "chore: refresh researched finance topics"
            git push
          fi
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-campus-topic-refresh-report
          path: topic-refresh-report.json
          if-no-files-found: ignore
