project:
  name: "The Finance Campus"
  language: "en"
  timezone: "Africa/Kampala"
  audience:
    - "global"
    - "Uganda"
    - "East Africa"
platforms:
  youtube:
    enabled: false
    short_videos_per_day: 2
    cross_publish_daily_shorts: true
    shorts:
      width: 1080
      height: 1920
      fps: 30
    long_form:
      width: 1920
      height: 1080
      fps: 30
  tiktok:
    enabled: false
    short_videos_per_day: 2
    cross_publish_daily_shorts: true
    width: 1080
    height: 1920
    fps: 30
audio:
  provider: "kokoro"
  allow_provider_replacement: false
  voice_profiles:
    - "male"
    - "female"
visual_identity:
  style: "minimalist_2d_cinematic_cartoon_storytelling"
  reference_character_design: "rounded expressive faces, bold dark outlines, simple readable features"
  palette: ["warm_brown", "beige", "cream", "charcoal", "muted_caramel"]
  environments: "cinematic illustrated interiors with architectural depth, warm practical lighting and soft shadows"
  characters:
    allow_multiple_per_scene: true
    require_story_specific_performance: true
    require_prop_interaction: true
    preserve_identity_and_clothing_between_scenes: true
  animation:
    synchronize_actions_to_narration: true
    animate_faces_hands_and_body: true
    animate_props_with_visible_origin_and_destination: true
    prohibit_static_full_scene_reveal: true
    require_scene_continuity: true
production:
  minimum_video_duration_seconds: 150
  shorts_target_seconds: [150, 180]
  long_form_target_minutes: [5, 10]
  publishing_enabled: false
  require_quality_gate: true
  require_publication_verification: true
schedule:
  unique_short_videos_per_day: 2
  short_posts_per_platform_per_day: 2
  cross_publish_each_short_to_both_platforms: true
  shorts_publish_times_eat: ["09:00", "18:00"]
  youtube_long_form_per_week: 3
research:
  weekly_new_topic_target: 20
  require_sources: true
  preferred_sources:
    - "central banks"
    - "financial regulators"
    - "government agencies"
    - "academic research"
    - "established financial education institutions"
cost_policy:
  target: "zero monetary cost"
  allow_paid_services: false
  allow_paid_api_keys: false
  allow_paid_assets: false
  allow_paid_hosting: false
  allow_paid_compute: false
  require_free_tier_quota_guards: true
  prefer_open_source_and_self_hosted: true
  stop_if_zero_cost_path_unavailable: true
automation:
  operating_mode: "staged_automation_pending_release_validation"
  require_routine_human_approval: true
  auto_research: true
  auto_topic_selection: true
  auto_script_generation: true
  auto_storyboarding: true
  auto_illustration_and_animation: true
  auto_kokoro_narration: true
  auto_rendering: true
  auto_quality_control: true
  auto_publish_after_all_gates_pass: false
  auto_publication_verification: false
  auto_retry_recoverable_failures: false
  prevent_duplicate_publications: false
  notify_on_blocking_failures: false
  publishing_activation_requires_end_to_end_validation: true
  initial_platform_authorization_required: true
editorial:
  emotional_promise:
    - "hope"
    - "possibility"
    - "confidence"
    - "empowerment"
    - "motivation"
    - "financial_agency"
  purpose: "Move viewers from awareness to informed, practical action."
  escalation:
    enabled: true
    use_realistic_financial_stakes: true
    show_cumulative_consequences: true
    connect_consequences_to_viewer_decisions: true
    prohibit_manufactured_panic: true
  required_story_arc:
    - "relatable_financial_problem"
    - "escalating_real_world_stakes"
    - "clear_explanation_of_why_it_matters"
    - "hopeful_and_realistic_possibility"
    - "practical_action_viewers_can_take"
    - "empowering_close"
  acceptable_urgency_topics:
    - "poverty"
    - "debt"
    - "inflation"
    - "unemployment"
    - "financial_insecurity"
    - "unexpected_expenses"
    - "scams_and_fraud"
  safeguards:
    require_evidence_for_factual_claims: true
    label_hypothetical_examples: true
    distinguish_risk_from_certainty: true
    prohibit_guaranteed_wealth_claims: true
    prohibit_guaranteed_investment_returns: true
    prohibit_shaming_people_in_financial_difficulty: true
    prohibit_exploitative_fear: true
    always_offer_a_realistic_next_step: true
