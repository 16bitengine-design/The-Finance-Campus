[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-finance-campus"
version = "0.1.0"
description = "Automated financial education media production system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Pillow>=10.0", "numpy>=1.26", "soundfile>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
tts = ["kokoro>=0.9.4,<1.0"]
manim = ["manim>=0.19,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/finance_campus/script_quality.py" = ["I001"]
"src/finance_campus/post_metadata.py" = ["I001"]
"src/finance_campus/buffer_publisher.py" = ["I001"]
"src/finance_campus/related_videos.py" = ["I001"]
